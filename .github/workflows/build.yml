name: Build PowerDim executable

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # PyInstaller is not cross-compiling: it can only produce a Windows .exe when
    # run on Windows, since it bundles the interpreter/DLLs of the host platform.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build executable
        run: pyinstaller --onefile --noconsole --name PowerDim main.py

      - uses: actions/upload-artifact@v4
        with:
          name: PowerDim-windows
          path: dist/PowerDim.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PowerDim.exe
          generate_release_notes: true
